<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Bros - Fixed Level Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(255, 215, 0, 0.3);
            border: 6px solid #222;
            border-radius: 10px;
            background: #5c94fc;
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            text-shadow: 2px 2px #000;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .hud-val {
            color: #fce0a8;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 20px;
            text-align: center;
        }

        #overlay-screen h1 {
            color: #e52521;
            font-size: 28px;
            text-shadow: 4px 4px #000, -2px -2px #fce0a8;
        }

        #overlay-screen p {
            color: #fce0a8;
            font-size: 11px;
            line-height: 1.8;
            max-width: 80%;
        }

        .btn {
            background: #4cbf00;
            color: #fff;
            border: 4px solid #fff;
            padding: 14px 28px;
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 6px #286600;
        }

        .btn:hover {
            background: #5be300;
        }

        #touch-controls {
            display: none;
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            justify-content: space-between;
            z-index: 15;
            pointer-events: none;
        }

        .dpad, .action-btns {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .t-btn {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.35);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            touch-action: manipulation;
        }

        @media (max-width: 800px) {
            #touch-controls { display: flex; }
            #hud { font-size: 9px; }
            #overlay-screen h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="hud">
        <div class="hud-item"><span>MARIO</span><span id="score-val" class="hud-val">000000</span></div>
        <div class="hud-item"><span>COINS</span><span id="coin-val" class="hud-val">🪙 x00</span></div>
        <div class="hud-item"><span>WORLD</span><span id="world-val" class="hud-val">1-1</span></div>
        <div class="hud-item"><span>TIME</span><span id="time-val" class="hud-val">300</span></div>
        <div class="hud-item"><span>LIVES</span><span id="lives-val" class="hud-val">❤️ x3</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="overlay-screen">
        <h1 id="overlay-title">SUPER MARIO BROS</h1>
        <p id="overlay-msg">GEÇİŞ ALANLARI VE DÜŞMAN KONUMLARI DÜZELTİLDİ!<br><br>Yön Tuşları / A-D: Hareket<br>Z / W / BOŞLUK: Zıplama<br>X / SHIFT: Koşma</p>
        <button id="start-btn" class="btn">OYUNA BAŞLA</button>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div class="t-btn" id="btn-left">◀</div>
            <div class="t-btn" id="btn-right">▶</div>
        </div>
        <div class="action-btns">
            <div class="t-btn" id="btn-run">🏃</div>
            <div class="t-btn" id="btn-jump">▲</div>
        </div>
    </div>
</div>

<script>
// SES SENTEZLEYİCİ
class AudioEngine {
    constructor() {
        this.ctx = null;
        this.bgmLoopTimeout = null;
        this.isPlayingBGM = false;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    playNote(freq, type, duration, vol = 0.05) {
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
    }

    sfxJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.15);
    }

    sfxCoin() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.28);
    }

    sfxStomp() { this.playNote(90, 'triangle', 0.1, 0.2); }
    
    sfxDie() {
        const notes = [500, 400, 300, 200, 100];
        notes.forEach((f, i) => {
            setTimeout(() => this.playNote(f, 'sawtooth', 0.12, 0.15), i * 80);
        });
    }

    startBGM() {
        this.stopBGM();
        if (!this.ctx) return;
        this.isPlayingBGM = true;

        const E5 = 659.25, C5 = 523.25, G5 = 783.99, G4 = 392.00,
              A4 = 440.00, B4 = 493.88, Bb4 = 466.16, F5 = 698.46,
              D5 = 587.33, E4 = 329.63, A5 = 880.00;

        const score = [
            {f: E5, d: 150}, {f: 0, d: 50}, {f: E5, d: 150}, {f: 0, d: 150}, {f: E5, d: 150}, {f: 0, d: 150},
            {f: C5, d: 150}, {f: E5, d: 150}, {f: 0, d: 150}, {f: G5, d: 250}, {f: 0, d: 250},
            {f: G4, d: 250}, {f: 0, d: 250},
            {f: C5, d: 200}, {f: 0, d: 100}, {f: G4, d: 200}, {f: 0, d: 100}, {f: E4, d: 200}, {f: 0, d: 100},
            {f: A4, d: 150}, {f: B4, d: 150}, {f: Bb4, d: 150}, {f: A4, d: 200},
            {f: G4, d: 120}, {f: E5, d: 120}, {f: G5, d: 120}, {f: A5, d: 200}, {f: F5, d: 120}, {f: G5, d: 120},
            {f: 0, d: 100}, {f: E5, d: 180}, {f: C5, d: 120}, {f: D5, d: 120}, {f: B4, d: 200}
        ];

        let index = 0;
        const playNextNote = () => {
            if (!this.isPlayingBGM) return;
            const item = score[index];
            if (item.f > 0) {
                this.playNote(item.f, 'square', item.d / 1000, 0.04);
            }
            index = (index + 1) % score.length;
            this.bgmLoopTimeout = setTimeout(playNextNote, item.d + 30);
        };

        playNextNote();
    }

    stopBGM() {
        this.isPlayingBGM = false;
        if (this.bgmLoopTimeout) clearTimeout(this.bgmLoopTimeout);
    }
}

const audio = new AudioEngine();

// CANVAS & RENKLER
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const PALETTE = {
    skyDay: '#5c94fc',
    grassGreen: '#00a800',
    grassDark: '#005800',
    dirtBrown: '#c84c0c',
    brickRed: '#b83800',
    questionYellow: '#fcb000',
    pipeGreen: '#00a800',
    pipeLight: '#80d010',
    pipeDark: '#005800',
    marioRed: '#e52521',
    marioBlue: '#283cda',
    marioSkin: '#fce0a8',
    marioHair: '#6b4400',
    goombaBrown: '#a84000'
};

function drawPixelRect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawMario(ctx, x, y, facing, isJumping, frame) {
    ctx.save();
    ctx.translate(Math.floor(x), Math.floor(y));
    if (facing === -1) {
        ctx.translate(24, 0);
        ctx.scale(-1, 1);
    }

    drawPixelRect(ctx, 6, 0, 14, 4, PALETTE.marioRed);
    drawPixelRect(ctx, 4, 4, 18, 4, PALETTE.marioRed);
    drawPixelRect(ctx, 4, 8, 8, 4, PALETTE.marioHair);
    drawPixelRect(ctx, 10, 8, 4, 4, PALETTE.marioSkin);
    drawPixelRect(ctx, 2, 12, 4, 8, PALETTE.marioHair);
    drawPixelRect(ctx, 6, 12, 12, 8, PALETTE.marioSkin);
    drawPixelRect(ctx, 14, 12, 4, 4, PALETTE.marioHair);

    drawPixelRect(ctx, 4, 20, 14, 8, PALETTE.marioRed);
    drawPixelRect(ctx, 6, 20, 10, 10, PALETTE.marioBlue);
    drawPixelRect(ctx, 8, 22, 2, 2, PALETTE.questionYellow);
    drawPixelRect(ctx, 14, 22, 2, 2, PALETTE.questionYellow);

    if (isJumping) {
        drawPixelRect(ctx, 0, 24, 6, 6, PALETTE.marioBlue);
        drawPixelRect(ctx, 16, 20, 6, 6, PALETTE.marioBlue);
        drawPixelRect(ctx, -2, 28, 8, 4, PALETTE.marioHair);
        drawPixelRect(ctx, 18, 24, 8, 4, PALETTE.marioHair);
    } else {
        let step = (Math.floor(frame) % 2 === 0) ? 0 : 3;
        drawPixelRect(ctx, 4 - step, 28, 6, 4, PALETTE.marioBlue);
        drawPixelRect(ctx, 12 + step, 28, 6, 4, PALETTE.marioBlue);
        drawPixelRect(ctx, 2 - step, 30, 8, 4, PALETTE.marioHair);
        drawPixelRect(ctx, 14 + step, 30, 8, 4, PALETTE.marioHair);
    }

    ctx.restore();
}

function drawGoomba(ctx, x, y, frame) {
    drawPixelRect(ctx, x + 4, y, 16, 12, PALETTE.goombaBrown);
    drawPixelRect(ctx, x + 2, y + 4, 20, 10, PALETTE.goombaBrown);
    drawPixelRect(ctx, x + 4, y + 6, 4, 6, '#fff');
    drawPixelRect(ctx, x + 16, y + 6, 4, 6, '#fff');
    drawPixelRect(ctx, x + 6, y + 8, 2, 4, '#000');
    drawPixelRect(ctx, x + 16, y + 8, 2, 4, '#000');

    if (Math.floor(frame) % 2 === 0) {
        drawPixelRect(ctx, x, y + 16, 8, 8, '#000');
        drawPixelRect(ctx, x + 14, y + 14, 8, 8, '#000');
    } else {
        drawPixelRect(ctx, x + 2, y + 14, 8, 8, '#000');
        drawPixelRect(ctx, x + 16, y + 16, 8, 8, '#000');
    }
}

// OYUN KONTROLÜ & HARİTA
class Game {
    constructor() {
        this.score = 0;
        this.coins = 0;
        this.totalCoinsInLevel = 0;
        this.maxCoins = 10;
        this.lives = 3;
        this.level = 1;
        this.time = 300;
        this.gameState = 'START';
        this.cameraX = 0;
        this.keys = {};

        this.bindEvents();
    }

    initLevel(lvl) {
        this.level = lvl;
        this.cameraX = 0;
        this.time = 300;
        this.totalCoinsInLevel = 0;

        const mapLen = 2400 + lvl * 400;
        this.currentLevel = {
            length: mapLen,
            blocks: [],
            enemies: [],
            flagX: mapLen - 180
        };

        // Zemin
        for (let x = 0; x < mapLen; x += 32) {
            if (x > 800 && x < 920 && lvl > 1) continue; // Çukur
            this.currentLevel.blocks.push({ x, y: 386, w: 32, h: 64, type: 'ground' });
        }

        // GEÇİŞ ALANLARI VE BORULAR
        this.currentLevel.blocks.push({ x: 380, y: 338, w: 44, h: 48, type: 'pipe' });
        this.currentLevel.blocks.push({ x: 750, y: 338, w: 44, h: 48, type: 'pipe' });
        this.currentLevel.blocks.push({ x: 1150, y: 338, w: 44, h: 48, type: 'pipe' });

        // Soru İşareti Blokları & Tuğlalar
        const blockPositions = [220, 252, 284, 500, 532, 564, 900, 932, 964, 1300];
        blockPositions.forEach((bx, idx) => {
            const isQuestion = idx % 2 === 0 && this.totalCoinsInLevel < this.maxCoins;
            if (isQuestion) this.totalCoinsInLevel++;
            this.currentLevel.blocks.push({
                x: bx,
                y: 240,
                w: 32,
                h: 32,
                type: isQuestion ? 'question' : 'brick',
                hit: false
            });
        });

        // Düşmanlar
        this.currentLevel.enemies.push(new Enemy(480, 360));
        this.currentLevel.enemies.push(new Enemy(880, 360));
        this.currentLevel.enemies.push(new Enemy(1250, 360));

        this.player = new Player(100, 200);
        document.getElementById('world-val').innerText = `1-${this.level}`;
        audio.startBGM();
    }

    bindEvents() {
        window.addEventListener('keydown', e => {
            this.keys[e.code] = true;
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) this.player.jump();
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });

        const bindTouch = (id, code) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[code] = true; if (code === 'KeyW') this.player.jump(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[code] = false; });
        };

        bindTouch('btn-left', 'ArrowLeft');
        bindTouch('btn-right', 'ArrowRight');
        bindTouch('btn-run', 'ShiftLeft');
        bindTouch('btn-jump', 'KeyW');

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.init();
            document.getElementById('overlay-screen').style.display = 'none';
            this.gameState = 'PLAYING';
            this.initLevel(1);
        });
    }

    update() {
        if (this.gameState !== 'PLAYING') return;

        if (Math.random() < 0.02) {
            this.time--;
            document.getElementById('time-val').innerText = this.time;
            if (this.time <= 0) this.playerDie();
        }

        this.player.update(this);

        if (this.player.x - this.cameraX > 350) {
            this.cameraX = this.player.x - 350;
        }

        // Düşman Etkileşimi
        this.currentLevel.enemies.forEach(e => {
            e.update(this);
            if (e.alive && checkCollision(this.player, e)) {
                if (this.player.vy > 0 && (this.player.y + this.player.h - this.player.vy) <= e.y + 14) {
                    e.alive = false;
                    this.player.vy = -9;
                    this.score += 200;
                    document.getElementById('score-val').innerText = String(this.score).padStart(6, '0');
                    audio.sfxStomp();
                } else {
                    this.playerDie();
                }
            }
        });

        // Bölüm Geçişi
        if (this.player.x >= this.currentLevel.flagX) {
            if (this.level < 3) {
                this.initLevel(this.level + 1);
            } else {
                this.win();
            }
        }

        if (this.player.y > 450) this.playerDie();
    }

    playerDie() {
        this.lives--;
        document.getElementById('lives-val').innerText = `❤️ x${this.lives}`;
        audio.sfxDie();

        if (this.lives > 0) {
            this.initLevel(this.level);
        } else {
            this.gameState = 'GAMEOVER';
            audio.stopBGM();
            document.getElementById('overlay-title').innerText = 'GAME OVER';
            document.getElementById('overlay-msg').innerText = `TOPLAM SKOR: ${this.score}`;
            document.getElementById('start-btn').innerText = 'TEKRAR DENE';
            document.getElementById('overlay-screen').style.display = 'flex';
        }
    }

    win() {
        this.gameState = 'WIN';
        audio.stopBGM();
        document.getElementById('overlay-title').innerText = 'TEBRİKLER!';
        document.getElementById('overlay-msg').innerText = `OYUNU TAMAMLADIN!\nSKORUN: ${this.score}`;
        document.getElementById('start-btn').innerText = 'YENİDEN BAŞLA';
        document.getElementById('overlay-screen').style.display = 'flex';
    }

    draw() {
        ctx.fillStyle = PALETTE.skyDay;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (this.gameState !== 'PLAYING') return;

        ctx.save();
        ctx.translate(-Math.floor(this.cameraX), 0);

        // Bloklar & Zemin
        this.currentLevel.blocks.forEach(b => {
            if (b.type === 'ground') {
                drawPixelRect(ctx, b.x, b.y, b.w, b.h, PALETTE.dirtBrown);
                drawPixelRect(ctx, b.x, b.y, b.w, 8, PALETTE.grassGreen);
                drawPixelRect(ctx, b.x, b.y + 8, b.w, 3, PALETTE.grassDark);
            } else if (b.type === 'brick') {
                drawPixelRect(ctx, b.x, b.y, b.w, b.h, PALETTE.brickRed);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            } else if (b.type === 'question') {
                drawPixelRect(ctx, b.x, b.y, b.w, b.h, b.hit ? '#777' : PALETTE.questionYellow);
                if (!b.hit) {
                    ctx.fillStyle = '#000';
                    ctx.font = '14px "Press Start 2P"';
                    ctx.fillText('?', b.x + 8, b.y + 22);
                }
            } else if (b.type === 'pipe') {
                drawPixelRect(ctx, b.x, b.y, b.w, b.h, PALETTE.pipeGreen);
                drawPixelRect(ctx, b.x - 3, b.y, b.w + 6, 12, PALETTE.pipeLight);
                drawPixelRect(ctx, b.x + b.w - 6, b.y, 6, b.h, PALETTE.pipeDark);
            }
        });

        // Bayrak
        const fx = this.currentLevel.flagX;
        drawPixelRect(ctx, fx, 100, 8, 286, '#fff');
        drawPixelRect(ctx, fx - 12, 100, 16, 16, PALETTE.questionYellow);
        drawPixelRect(ctx, fx - 32, 120, 32, 24, PALETTE.marioRed);

        // Düşmanlar
        this.currentLevel.enemies.forEach(e => {
            if (e.alive) drawGoomba(ctx, e.x, e.y, Date.now() / 200);
        });

        // Oyuncu Mario
        this.player.draw(ctx);

        ctx.restore();
    }
}

// OYUNCU SINIFI
class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 24; this.h = 32;
        this.vx = 0; this.vy = 0;
        this.isGrounded = false;
        this.facing = 1;
        this.animFrame = 0;
    }

    jump() {
        if (this.isGrounded) {
            this.vy = -13;
            this.isGrounded = false;
            audio.sfxJump();
        }
    }

    update(game) {
        const speed = game.keys['ShiftLeft'] || game.keys['KeyX'] ? 4.8 : 3.2;

        if (game.keys['ArrowRight'] || game.keys['KeyD']) {
            this.vx = speed;
            this.facing = 1;
        } else if (game.keys['ArrowLeft'] || game.keys['KeyA']) {
            this.vx = -speed;
            this.facing = -1;
        } else {
            this.vx = 0;
        }

        this.vy += 0.65;

        // X Hareket
        this.x += this.vx;
        game.currentLevel.blocks.forEach(b => {
            if (checkCollision(this, b)) {
                if (this.vx > 0) this.x = b.x - this.w;
                else if (this.vx < 0) this.x = b.x + b.w;
            }
        });

        // Y Hareket
        this.y += this.vy;
        this.isGrounded = false;
        game.currentLevel.blocks.forEach(b => {
            if (checkCollision(this, b)) {
                if (this.vy > 0) {
                    this.y = b.y - this.h;
                    this.vy = 0;
                    this.isGrounded = true;
                } else if (this.vy < 0) {
                    this.y = b.y + b.h;
                    this.vy = 0;
                    if (b.type === 'question' && !b.hit) {
                        b.hit = true;
                        game.coins++;
                        game.score += 200;
                        document.getElementById('coin-val').innerText = `🪙 x${String(game.coins).padStart(2, '0')}`;
                        document.getElementById('score-val').innerText = String(game.score).padStart(6, '0');
                        audio.sfxCoin();
                    }
                }
            }
        });

        if (Math.abs(this.vx) > 0) this.animFrame += 0.2;
    }

    draw(ctx) {
        drawMario(ctx, this.x, this.y, this.facing, !this.isGrounded, this.animFrame);
    }
}

// DÜŞMAN SINIFI
class Enemy {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 24; this.h = 24;
        this.vx = -1.2; this.vy = 0;
        this.alive = true;
    }

    update(game) {
        if (!this.alive) return;
        this.vy += 0.5;
        this.x += this.vx;

        game.currentLevel.blocks.forEach(b => {
            if (checkCollision(this, b)) {
                this.vx *= -1;
                this.x += this.vx;
            }
        });

        this.y += this.vy;
        game.currentLevel.blocks.forEach(b => {
            if (checkCollision(this, b)) {
                if (this.vy > 0) {
                    this.y = b.y - this.h;
                    this.vy = 0;
                }
            }
        });
    }
}

function checkCollision(r1, r2) {
    return !(r1.x + r1.w <= r2.x ||
             r1.x >= r2.x + r2.w ||
             r1.y + r1.h <= r2.y ||
             r1.y >= r2.y + r2.h);
}

const game = new Game();
function loop() {
    game.update();
    game.draw();
    requestAnimationFrame(loop);
}
loop();
</script>
